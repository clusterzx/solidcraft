# The SolidCraft web app (packaging/docker/Dockerfile).
#
# Caching follows the app's update check (xtask/src/web_offline.rs): index.html, sw.js and
# build.json must always be asked for again, or browsers keep an old build; Trunk's hashed
# files (filehash = true) never change and are kept for a year.
#
# /mcp (agents) and /bridge (the app's tab) go to solidcraft-relay, the `relay` service of
# compose.yaml (docs/web-mcp.md). Its address is looked up when a request comes (Docker's DNS),
# not when nginx starts: without a relay the site works as before, those two answer 502 and the
# app simply doesn't connect.

# The relay's protocol as the proxy in front says it (https behind a TLS proxy), else this one's.
map $http_x_forwarded_proto $solidcraft_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $solidcraft_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/solidcraft;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json application/manifest+json image/svg+xml font/ttf;

    # Cross-origin isolated (COOP and COEP): the page may share memory with its workers, so the
    # app runs its build with threads (docs/web-threads.md). Every file comes from this site.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~ "-[0-9a-f]{8,16}(_bg)?\.(js|wasm|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location = /mcp {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $solidcraft_relay http://relay:8090;
        proxy_pass $solidcraft_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $solidcraft_host;
        proxy_set_header X-Forwarded-Proto $solidcraft_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A tool call waits for the tab: a batch up to an hour (the relay's own limit is shorter).
        proxy_read_timeout 3800s;
        proxy_send_timeout 3800s;
        proxy_buffering off;
        client_max_body_size 16m;
    }

    location = /bridge {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $solidcraft_relay http://relay:8090;
        proxy_pass $solidcraft_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $solidcraft_host;
        proxy_set_header X-Forwarded-Proto $solidcraft_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The relay says something every 20 s; a quiet hour means the tab is gone.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
