[package]
name = "solidcraft-thread"
description = "SolidCraft threads: the system's on native, Web Workers sharing the module's memory in a browser build with threads"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# A browser build with threads (`-C target-feature=+atomics`, docs/web-threads.md) starts Web Workers.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Event", "Navigator", "Url", "Window", "Worker", "WorkerOptions", "WorkerType", "console"] }
